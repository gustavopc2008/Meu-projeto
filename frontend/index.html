<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 Rádio da Escola - Indique sua Música</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #1DB954;
      --primary-dark: #1ed760;
      --primary-light: #1ed760;
      --secondary: #191414;
      --dark: #121212;
      --darker: #0a0a0a;
      --light: #ffffff;
      --gray: #b3b3b3;
      --gray-dark: #535353;
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.15);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      --shadow-hover: 0 30px 80px rgba(29, 185, 84, 0.3);
      --glow: 0 0 40px rgba(29, 185, 84, 0.4);
    }

    body {
      font-family: 'Inter', 'Poppins', sans-serif;
      background: #0a0a0a;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(29, 185, 84, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(118, 75, 162, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(79, 172, 254, 0.1) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--light);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Partículas animadas no fundo */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(29, 185, 84, 0.3);
      animation: float 20s infinite ease-in-out;
    }

    .particle:nth-child(1) {
      width: 80px;
      height: 80px;
      left: 10%;
      animation-delay: 0s;
      animation-duration: 25s;
    }

    .particle:nth-child(2) {
      width: 120px;
      height: 120px;
      left: 20%;
      animation-delay: 2s;
      animation-duration: 30s;
      background: rgba(118, 75, 162, 0.2);
    }

    .particle:nth-child(3) {
      width: 60px;
      height: 60px;
      left: 50%;
      animation-delay: 4s;
      animation-duration: 20s;
      background: rgba(79, 172, 254, 0.25);
    }

    .particle:nth-child(4) {
      width: 100px;
      height: 100px;
      left: 70%;
      animation-delay: 1s;
      animation-duration: 35s;
    }

    .particle:nth-child(5) {
      width: 90px;
      height: 90px;
      left: 85%;
      animation-delay: 3s;
      animation-duration: 28s;
      background: rgba(240, 147, 251, 0.2);
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(100vh) translateX(0) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100px) translateX(100px) scale(1);
        opacity: 0;
      }
    }

    .container {
      width: 100%;
      max-width: 1400px;
      position: relative;
      z-index: 1;
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    header {
      text-align: center;
      margin-bottom: 50px;
      padding: 40px 20px;
      position: relative;
    }

    .logo-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 4.5rem;
      font-weight: 900;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #1DB954 0%, #1ed760 50%, #ffffff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      display: inline-block;
      letter-spacing: -2px;
      animation: logoGlow 3s ease-in-out infinite;
      filter: drop-shadow(0 0 30px rgba(29, 185, 84, 0.5));
    }

    @keyframes logoGlow {
      0%, 100% {
        filter: drop-shadow(0 0 30px rgba(29, 185, 84, 0.5)) brightness(1);
      }
      50% {
        filter: drop-shadow(0 0 50px rgba(29, 185, 84, 0.8)) brightness(1.2);
      }
    }

    .logo::after {
      content: '🎵';
      position: absolute;
      right: -60px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 3rem;
      animation: musicNote 2s ease-in-out infinite;
    }

    @keyframes musicNote {
      0%, 100% {
        transform: translateY(-50%) rotate(0deg) scale(1);
      }
      50% {
        transform: translateY(-60%) rotate(15deg) scale(1.1);
      }
    }

    .subtitle {
      font-size: 1.4rem;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 300;
      margin-top: 15px;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .search-card {
      background: rgba(18, 18, 18, 0.7);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 2px solid var(--card-border);
      border-radius: 32px;
      padding: 50px;
      box-shadow: 
        var(--shadow),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      margin-bottom: 40px;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    .search-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(29, 185, 84, 0.1) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .search-card:hover::before {
      opacity: 1;
    }

    .search-card:hover {
      box-shadow: var(--shadow-hover), var(--glow);
      transform: translateY(-8px);
      border-color: rgba(29, 185, 84, 0.4);
    }

    .form-group {
      margin-bottom: 28px;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 12px;
      font-weight: 600;
      color: var(--light);
      font-size: 1rem;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      font-size: 0.85rem;
      opacity: 0.9;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 16px;
      padding: 2px;
      background: linear-gradient(135deg, rgba(29, 185, 84, 0.5), rgba(118, 75, 162, 0.5));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .input-wrapper:focus-within::before {
      opacity: 1;
    }

    input[type="text"] {
      width: 100%;
      padding: 18px 24px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      color: var(--light);
      font-size: 1.05rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
      position: relative;
    }

    input[type="text"]:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--primary);
      box-shadow: 
        0 0 0 4px rgba(29, 185, 84, 0.15),
        0 8px 24px rgba(29, 185, 84, 0.2);
      transform: translateY(-2px);
    }

    input[type="text"]::placeholder {
      color: rgba(255, 255, 255, 0.4);
      font-weight: 300;
    }

    .btn {
      width: 100%;
      padding: 20px 32px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border: none;
      border-radius: 16px;
      color: var(--light);
      font-size: 1.15rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 
        0 8px 24px rgba(29, 185, 84, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
      margin-top: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .btn:hover::before {
      width: 400px;
      height: 400px;
    }

    .btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 
        0 12px 32px rgba(29, 185, 84, 0.4),
        0 0 40px rgba(29, 185, 84, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .btn:active {
      transform: translateY(-2px) scale(1);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn span {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .results {
      margin-top: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 24px;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { 
        opacity: 0;
        transform: translateY(20px);
      }
      to { 
        opacity: 1;
        transform: translateY(0);
      }
    }

    .results-header {
      grid-column: 1 / -1;
      text-align: center;
      margin-bottom: 30px;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--light);
      text-shadow: 0 2px 20px rgba(29, 185, 84, 0.3);
      letter-spacing: -0.5px;
    }

    .track-card {
      background: rgba(18, 18, 18, 0.7);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 2px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: slideIn 0.6s ease-out;
      animation-fill-mode: both;
      position: relative;
      overflow: hidden;
    }

    .track-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(29, 185, 84, 0.1), transparent);
      transition: left 0.5s ease;
    }

    .track-card:hover::before {
      left: 100%;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .track-card:nth-child(1) { animation-delay: 0.1s; }
    .track-card:nth-child(2) { animation-delay: 0.2s; }
    .track-card:nth-child(3) { animation-delay: 0.3s; }
    .track-card:nth-child(4) { animation-delay: 0.4s; }
    .track-card:nth-child(5) { animation-delay: 0.5s; }
    .track-card:nth-child(6) { animation-delay: 0.6s; }

    .track-card:hover {
      transform: translateY(-12px) scale(1.02);
      box-shadow: 
        var(--shadow-hover),
        var(--glow);
      border-color: var(--primary);
    }

    .track-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--light);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      letter-spacing: -0.3px;
    }

    .track-channel {
      font-size: 0.95rem;
      color: var(--gray);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }

    .track-channel::before {
      content: '🎤';
      font-size: 1rem;
      filter: drop-shadow(0 0 4px rgba(29, 185, 84, 0.5));
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      margin-bottom: 18px;
      border-radius: 16px;
      overflow: hidden;
      background: var(--darker);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }

    .track-card:hover .video-container {
      box-shadow: 0 12px 32px rgba(29, 185, 84, 0.3);
      transform: scale(1.02);
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 16px;
    }

    .btn-suggest {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 12px;
      color: var(--light);
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 
        0 4px 16px rgba(29, 185, 84, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      letter-spacing: 0.3px;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
    }

    .btn-suggest::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.5s, height 0.5s;
    }

    .btn-suggest:hover::before {
      width: 300px;
      height: 300px;
    }

    .btn-suggest:hover {
      transform: translateY(-3px);
      box-shadow: 
        0 8px 24px rgba(29, 185, 84, 0.4),
        0 0 30px rgba(29, 185, 84, 0.2);
    }

    .btn-suggest span {
      position: relative;
      z-index: 1;
    }

    .loading {
      text-align: center;
      padding: 60px 40px;
      font-size: 1.3rem;
      color: var(--light);
    }

    .spinner {
      display: inline-block;
      width: 60px;
      height: 60px;
      border: 5px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
      box-shadow: 0 0 20px rgba(29, 185, 84, 0.3);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message, .empty-message {
      text-align: center;
      padding: 40px;
      background: rgba(231, 76, 60, 0.15);
      border: 2px solid rgba(231, 76, 60, 0.4);
      border-radius: 20px;
      color: var(--light);
      font-size: 1.2rem;
      backdrop-filter: blur(20px);
    }

    .empty-message {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Modal de Regras */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(20px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      animation: fadeIn 0.3s ease-out;
      padding: 20px;
    }

    .modal-content {
      background: linear-gradient(135deg, rgba(18, 18, 18, 0.98), rgba(25, 20, 20, 0.98));
      backdrop-filter: blur(40px);
      border: 2px solid var(--primary);
      border-radius: 32px;
      padding: 50px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 
        0 30px 80px rgba(29, 185, 84, 0.4),
        var(--glow);
      animation: scaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    .modal-content::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(29, 185, 84, 0.1) 0%, transparent 70%);
      animation: rotate 20s linear infinite;
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-content h2 {
      font-size: 2.2rem;
      margin-bottom: 35px;
      color: var(--primary);
      font-weight: 800;
      position: relative;
      z-index: 1;
      text-shadow: 0 0 20px rgba(29, 185, 84, 0.5);
    }

    .rules-list {
      list-style: none;
      text-align: left;
      margin-bottom: 35px;
      position: relative;
      z-index: 1;
    }

    .rules-list li {
      padding: 18px 20px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      border-left: 4px solid var(--primary);
      font-size: 1.05rem;
      line-height: 1.7;
      transition: all 0.3s ease;
    }

    .rules-list li:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateX(5px);
    }

    .rules-list li:last-child {
      border-left-color: var(--primary-dark);
      background: rgba(29, 185, 84, 0.15);
    }

    .toast {
      position: fixed;
      bottom: 40px;
      right: 40px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: var(--light);
      padding: 20px 28px;
      border-radius: 16px;
      box-shadow: 
        0 8px 32px rgba(29, 185, 84, 0.4),
        var(--glow);
      z-index: 3000;
      animation: slideInRight 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      font-weight: 600;
      max-width: 350px;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .toast.error {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      box-shadow: 0 8px 32px rgba(231, 76, 60, 0.4);
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(150px) scale(0.8);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .logo {
        font-size: 3rem;
      }

      .logo::after {
        right: -45px;
        font-size: 2rem;
      }

      .search-card {
        padding: 35px 25px;
        border-radius: 24px;
      }

      .results {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .modal-content {
        padding: 35px 25px;
        border-radius: 24px;
      }

      .toast {
        right: 20px;
        bottom: 20px;
        left: 20px;
        max-width: none;
      }
    }

    @media (max-width: 480px) {
      .logo {
        font-size: 2.5rem;
      }

      .logo::after {
        display: none;
      }

      .subtitle {
        font-size: 1.1rem;
      }

      .search-card {
        padding: 25px 20px;
      }

      .results-header {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="container">
    <header>
      <div class="logo-wrapper">
        <h1 class="logo">Rádio da Escola</h1>
      </div>
      <p class="subtitle">Indique sua música favorita para tocar na escola!</p>
    </header>

    <div class="search-card">
      <div class="form-group">
        <label for="nomePessoa">👤 Seu Nome</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="nomePessoa" 
            placeholder="Digite seu nome completo"
            autocomplete="name"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="musica">🎶 Nome da Música</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="musica" 
            placeholder="Digite o nome da música ou artista"
            autocomplete="off"
          >
        </div>
      </div>

      <button class="btn" onclick="buscarMusica()" id="btnBuscar">
        <span>🔍 Buscar Música</span>
      </button>

      <div class="results" id="results"></div>
    </div>
  </div>

  <script>
    // Função para mostrar toast de notificação
    function showToast(message, isError = false) {
      const toast = document.createElement('div');
      toast.className = `toast ${isError ? 'error' : ''}`;
      toast.textContent = message;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.animation = 'slideInRight 0.4s ease-out reverse';
        setTimeout(() => toast.remove(), 400);
      }, 3000);
    }

    // Permitir busca com Enter
    document.getElementById('musica').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        buscarMusica();
      }
    });

    async function buscarMusica() {
      const nomePessoa = document.getElementById('nomePessoa').value.trim();
      const musica = document.getElementById('musica').value.trim();
      const resultsDiv = document.getElementById('results');
      const btnBuscar = document.getElementById('btnBuscar');

      if (!nomePessoa || !musica) {
        showToast('⚠️ Por favor, preencha seu nome e a música!', true);
        return;
      }

      // Desabilitar botão e mostrar loading
      btnBuscar.disabled = true;
      btnBuscar.innerHTML = '<span>🔍 Buscando...</span>';

      resultsDiv.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>Buscando músicas incríveis para você...</p>
        </div>
      `;

      try {
        const response = await fetch(`/search?q=${encodeURIComponent(musica)}`);
        const data = await response.json();

        // Reabilitar botão
        btnBuscar.disabled = false;
        btnBuscar.innerHTML = '<span>🔍 Buscar Música</span>';

        if (!data.items || !data.items.length) {
          resultsDiv.innerHTML = `
            <div class="empty-message">
              <p>😔 Nenhum resultado encontrado para "${musica}"</p>
              <p style="margin-top: 10px; font-size: 0.9rem; opacity: 0.8;">Tente buscar com outro termo ou verifique a escrita.</p>
            </div>
          `;
          return;
        }

        resultsDiv.innerHTML = `<div class="results-header">🎵 Resultados para ${nomePessoa}</div>`;

        data.items.forEach((item, index) => {
          const videoId = item.id.videoId;
          const title = item.snippet.title;
          const channel = item.snippet.channelTitle;
          const thumbnail = item.snippet.thumbnails.medium?.url || '';

          const trackCard = document.createElement('div');
          trackCard.className = 'track-card';
          trackCard.style.animationDelay = `${index * 0.1}s`;
          trackCard.innerHTML = `
            <h3 class="track-title">${escapeHtml(title)}</h3>
            <p class="track-channel">${escapeHtml(channel)}</p>
            <div class="video-container">
              <iframe 
                src="https://www.youtube.com/embed/${videoId}" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen
                loading="lazy"
              ></iframe>
            </div>
            <button class="btn-suggest" onclick="enviarSugestao('${escapeHtml(title)}','${escapeHtml(channel)}','${videoId}')">
              ✅ Enviar Sugestão
            </button>
          `;
          resultsDiv.appendChild(trackCard);
        });

        // Scroll suave para os resultados
        resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });

      } catch (error) {
        btnBuscar.disabled = false;
        btnBuscar.innerHTML = '<span>🔍 Buscar Música</span>';
        resultsDiv.innerHTML = `
          <div class="error-message">
            <p>❌ Erro ao buscar músicas</p>
            <p style="margin-top: 10px; font-size: 0.9rem; opacity: 0.8;">Tente novamente em alguns instantes.</p>
          </div>
        `;
        console.error(error);
        showToast('❌ Erro ao buscar músicas. Tente novamente!', true);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function enviarSugestao(musica, canal, videoId) {
      const nomePessoa = document.getElementById('nomePessoa').value.trim();
      if (!nomePessoa) {
        showToast('⚠️ Digite seu nome primeiro!', true);
        return;
      }

      // Criar modal de regras
      const modalOverlay = document.createElement('div');
      modalOverlay.className = 'modal-overlay';
      modalOverlay.id = 'avisoEnvio';

      const modalContent = document.createElement('div');
      modalContent.className = 'modal-content';

      modalContent.innerHTML = `
        <h2>⚠️ Regras para Pedir Música</h2>
        <ul class="rules-list">
          <li>❌ Não pode músicas com palavrões ou linguagem inadequada</li>
          <li>❌ Não pode músicas com conteúdo impróprio ou ofensivo</li>
          <li>❌ Não pode músicas que promovam violência ou discriminação</li>
          <li>✅ Peça músicas legais e apropriadas para todos curtirem!</li>
        </ul>
        <button class="btn" id="btnConfirmar" disabled>
          <span>Concordo e aceito as regras (<span id="timer">15</span>)</span>
        </button>
      `;

      modalOverlay.appendChild(modalContent);
      document.body.appendChild(modalOverlay);

      // Timer para liberar o botão
      let segundos = 15;
      const btnConfirmar = document.getElementById('btnConfirmar');
      const timerSpan = document.getElementById('timer');

      const timer = setInterval(() => {
        segundos--;
        timerSpan.textContent = segundos;
        if (segundos <= 0) {
          clearInterval(timer);
          btnConfirmar.innerHTML = '<span>✅ Concordo e Enviar Sugestão</span>';
          btnConfirmar.disabled = false;
        }
      }, 1000);

      // Quando confirmar, envia a sugestão
      btnConfirmar.addEventListener('click', async () => {
        if (btnConfirmar.disabled) return;

        btnConfirmar.disabled = true;
        btnConfirmar.innerHTML = '<span>⏳ Enviando...</span>';

        const link = `https://www.youtube.com/watch?v=${videoId}`;

        try {
          const response = await fetch('/suggest', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              nome: nomePessoa,
              musica: musica,
              canal: canal,
              link: link
            })
          });

          const data = await response.json();

          modalOverlay.remove();

          if (data.success) {
            showToast('✅ Sugestão enviada com sucesso!');
            // Limpar campo de música
            document.getElementById('musica').value = '';
          } else {
            showToast('❌ Erro ao enviar sugestão. Tente novamente!', true);
          }
        } catch (error) {
          modalOverlay.remove();
          showToast('❌ Erro ao enviar sugestão. Tente novamente!', true);
          console.error(error);
        }
      });

      // Fechar modal ao clicar fora
      modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) {
          clearInterval(timer);
          modalOverlay.remove();
        }
      });
    }
  </script>
</body>
</html>
